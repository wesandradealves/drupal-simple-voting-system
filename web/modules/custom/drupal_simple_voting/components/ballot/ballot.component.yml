$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Ballot
status: stable
description: The card that frames one question, its options and the vote action.
props:
  type: object
  properties:
    question_description:
      type: string
      title: Optional supporting text
    total_votes:
      type: integer
      title: Total votes cast in this question
    show_totals:
      type: boolean
      title: The question reveals vote counts
slots:
  status:
    title: Status banner slot
  options:
    title: The list of ballot options
  actions:
    title: The submit button
