# Without this the collection page lists polls and offers no way to create one:
# the add form exists but nothing in the interface points at it.
entity.voting_question.add_form:
  route_name: entity.voting_question.add_form
  title: 'Add poll'
  appears_on:
    - entity.voting_question.collection
    - system.admin_content

# The kill switch belongs next to the polls it switches off. Configuration is
# where its route lives, but nobody managing polls thinks to look there.
drupal_simple_voting.settings:
  route_name: drupal_simple_voting.settings
  title: 'Voting settings'
  appears_on:
    - entity.voting_question.collection
