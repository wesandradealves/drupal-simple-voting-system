x-php-image: &php-image ${COMPOSE_PROJECT_NAME:-simple-voting-system}-php

x-php-build: &php-build
  context: ./docker/php
  args:
    PHP_VERSION: ${PHP_VERSION:-8.4}
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}
    SASS_VERSION: ${SASS_VERSION:-1.103.1}

services:
  nginx:
    image: nginx:1.31.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: *php-image
    build: *php-build
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-drupal}
      DB_USER: ${DB_USER:-drupal}
      DB_PASSWORD: ${DB_PASSWORD:-drupal}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-Simple Voting System}
      DRUPAL_ACCOUNT_NAME: ${DRUPAL_ACCOUNT_NAME:-admin}
      DRUPAL_ACCOUNT_PASS: ${DRUPAL_ACCOUNT_PASS:-admin}
      DRUPAL_ACCOUNT_MAIL: ${DRUPAL_ACCOUNT_MAIL:-admin@example.com}
      DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://localhost:8081}
      DRUPAL_INSTALL_PROFILE: ${DRUPAL_INSTALL_PROFILE:-standard}
      DRUSH_OPTIONS_URI: ${DRUPAL_BASE_URL:-http://localhost:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4.12
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-drupal}
      MARIADB_USER: ${DB_USER:-drupal}
      MARIADB_PASSWORD: ${DB_PASSWORD:-drupal}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  adminer:
    image: adminer:6.0.1-standalone
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-db}
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:v1.31.0
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  sass:
    image: *php-image
    build: *php-build
    profiles: ["dev"]
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /var/www/html/web/themes/custom/voting_theme
    command: ["sass", "--watch", "--poll", "--no-source-map", "--no-error-css", "--style=compressed", "scss/style.scss:css/style.css"]
    volumes:
      - .:/var/www/html

volumes:
  db_data:
