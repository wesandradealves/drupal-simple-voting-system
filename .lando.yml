name: sistema-de-votacao
recipe: drupal11

config:
  php: '8.4'
  composer_version: '2-latest'
  via: nginx
  webroot: web
  database: mariadb:11.4
  xdebug: false
  config:
    # Replaces the recipe defaults. The vhost carries the front-controller
    # allow-list; the recipe's stock vhost would expose /autoload.php.
    php: .lando/php/php.ini
    vhosts: .lando/nginx/default.conf.tpl

services:
  appserver:
    build_as_root:
      - bash /app/.lando/scripts/install-dart-sass.sh
    overrides:
      environment:
        SASS_VERSION: '1.103.1'
        DB_HOST: database
        DB_NAME: drupal
        DB_USER: drupal
        DB_PASSWORD: drupal
        DRUPAL_SITE_NAME: Simple Voting System
        DRUPAL_ACCOUNT_NAME: admin
        DRUPAL_ACCOUNT_PASS: admin
        DRUPAL_ACCOUNT_MAIL: admin@example.com
        DRUPAL_BASE_URL: https://sistema-de-votacao.lndo.site
        DRUPAL_INSTALL_PROFILE: minimal
        DRUSH_OPTIONS_URI: https://sistema-de-votacao.lndo.site

  database:
    creds:
      user: drupal
      password: drupal
      database: drupal

  mailpit:
    type: mailpit
    mailFrom:
      - appserver

proxy:
  mailpit:
    - mail.sistema-de-votacao.lndo.site

tooling:
  composer:
    service: appserver
    description: Run composer commands
    cmd:
      - php -d memory_limit=-1 /usr/local/bin/composer

  drush:
    service: appserver
    description: Run the project drush from vendor/bin
    cmd: /app/vendor/bin/drush

  install:
    service: appserver
    description: Install or repair the Drupal site, idempotently
    cmd: bash /app/scripts/install.sh

  reinstall:
    service: appserver
    description: Drop the database and install Drupal from scratch
    cmd: bash /app/scripts/install.sh
    env:
      FORCE_INSTALL: '1'

  sass:
    service: appserver
    description: Compile every stylesheet the module ships
    dir: /app/web/modules/custom/drupal_simple_voting
    cmd: sass --no-source-map --style=expanded scss/voting.scss:css/voting.css scss/admin.scss:css/admin.css components/ballot/ballot.scss:components/ballot/ballot.css components/ballot-option/ballot-option.scss:components/ballot-option/ballot-option.css components/poll-card/poll-card.scss:components/poll-card/poll-card.css components/poll-filter/poll-filter.scss:components/poll-filter/poll-filter.css components/vote-status/vote-status.scss:components/vote-status/vote-status.css

  sass:watch:
    service: appserver
    description: Recompile the module stylesheets on every change
    dir: /app/web/modules/custom/drupal_simple_voting
    cmd: sass --watch --poll --no-source-map --style=expanded scss/voting.scss:css/voting.css scss/admin.scss:css/admin.css components/ballot/ballot.scss:components/ballot/ballot.css components/ballot-option/ballot-option.scss:components/ballot-option/ballot-option.css components/poll-card/poll-card.scss:components/poll-card/poll-card.css components/poll-filter/poll-filter.scss:components/poll-filter/poll-filter.css components/vote-status/vote-status.scss:components/vote-status/vote-status.css
