[PHP]

; Replaces the drupal11 recipe php.ini. Ported from docker/php/conf.d/zz-drupal.ini
; and zz-xdebug.ini. sendmail_path is deliberately absent: the mailpit service writes
; its own conf.d fragment pointing at sendmailpit:1025 and that has to win.

short_open_tag = Off
output_buffering = 4096
request_order = "GP"
register_argc_argv = Off
enable_dl = Off
allow_url_fopen = On
expose_php = On
disable_functions =

[Date]
date.timezone = "UTC"

[Resources]
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
upload_max_filesize = 64M
post_max_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Errors]
display_errors = On
display_startup_errors = On
; Barrio calls the deprecated theme_get_setting() on every page render.
error_reporting = E_ALL & ~E_DEPRECATED
ignore_repeated_errors = On
html_errors = Off
log_errors = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[Xdebug]
; PHP expands ${XDEBUG_MODE} from the environment; Lando sets it from config.xdebug
; in .lando.yml. This build ships no `lando xdebug` command: flip config.xdebug to
; true and run `lando rebuild` to load the extension.
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = trigger
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.max_nesting_level = 512
xdebug.log_level = 0
